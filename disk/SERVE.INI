; SERVE.INI - Kermit for one file transfer the Raspberry Pi asked for.
; PI.BAT runs KERMIT -f SERVE.INI when PILINK says so; the Pi sends or
; fetches files, then says BYE, and Kermit ends (PI.BAT goes back to PILINK).
; Files arrive in the folder PI was started from.
set port com1
set speed 9600
set parity none
set flow-control none
set file collision rename
server
