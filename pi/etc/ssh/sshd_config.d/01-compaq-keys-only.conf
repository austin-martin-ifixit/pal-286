# Compaq link: SSH only with a key (the one ssh-copy-id put there from the
# Mac), never a password, so nobody on the office Wi-Fi can guess their way
# in. Named to be read before 50-cloud-init.conf, which turns passwords on
# (sshd keeps the first value it reads). install.sh only puts this in place
# when the admin account has a key.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
