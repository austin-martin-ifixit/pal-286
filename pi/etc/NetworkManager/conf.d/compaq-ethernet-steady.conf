# Compaq link: on a wired port with no DHCP server (a cable straight to the
# Mac, for recovery), give up on DHCP after 15 seconds. install.sh also sets
# each wired profile to use a self-made address (169.254.x.x) then, and to
# count the port as up on its IPv6 link-local address, instead of resetting
# the port over and over (each reset dropped any SSH session on the cable)
# and holding up start-up for a minute. A wired network that does hand out
# addresses works as before.
[connection-compaq-ethernet]
match-device=type:ethernet
ipv4.dhcp-timeout=15
