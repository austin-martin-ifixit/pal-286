# PAL 286 settings. Installed once; deploys never overwrite this file.
# After changing it: ssh pizero 'sudo systemctl restart compaq-pal'

# Its name, on the Compaq's nameplate and in what it says.
NAME=PAL 286

# Which Claude model does the thinking. claude-sonnet-5-5 starts talking
# about 1.7 seconds after you finish (and is funny); claude-opus-5-5 is a
# little cleverer but takes 2.5 to 4 seconds; claude-haiku-5-5 is the
# cheapest and nearly as quick, but rambles.
MODEL=claude-sonnet-5-5

# Web searches allowed per question, for news, scores and the like
# (each costs a cent). 0 turns searching off.
SEARCHES=2

# Where the office is, for the weather and local search results.
CITY=
REGION=
COUNTRY=US
TIMEZONE=America/New_York

# Hours when PAL stays silent: no greetings, no listening (24-hour clock,
# from-to, e.g. 21-7). Empty: never.
QUIET_HOURS=

# Hours before PAL greets the same person again.
GREET_EVERY_HOURS=4

# The voice: mainframe (calm and low), clear (the same at a normal talking
# pace), dectalk (1980s terminal) or arcade (8-bit robot); SPEED is words a
# minute, PITCH 0-99 (mainframe, dectalk and arcade only), VOLUME 0-100. The
# characters (ogre, trailer, villain, chipmunk, butler, radio, grandpa,
# whisper) are for "Hey PAL, talk like..." and the menu's "Change PAL's voice".
VOICE=mainframe
SPEED=150
PITCH=28
VOLUME=80

# A soft tick from the speaker as soon as PAL knows it was spoken to, so
# the few seconds before it answers aren't silent: yes or no.
HEARD_TICK=yes

# Read typed chats ("Talk to PAL" in the menu) out loud as well: yes or no.
SPEAK_TYPED_CHAT=no

# Offer a spoken tip when someone at the lobby keyboard seems stuck in a
# program (it keeps saying it doesn't understand them): yes or no.
TIPS=yes

# Leave these empty to find the devices automatically. CAMERA is a path like
# /dev/video0; MICROPHONE and SPEAKER are ALSA names like plughw:CARD=Device,DEV=0
# (see "arecord -l" and "aplay -l"). A speaker on an aux cord in the Pi's
# headphone socket is plughw:CARD=Headphones,DEV=0; a Bluetooth one is
# bluealsa:DEV=AA:BB:CC:DD:EE:FF,PROFILE=a2dp (README.md).
CAMERA=
MICROPHONE=
SPEAKER=

# Cheap speakers switch themselves off after a quiet while. With one on the
# headphone socket, the Pi plays a tone the whole time that's too low and
# quiet to hear (30 Hz), so it never does: yes or no. (Keep that speaker
# on charge: it won't switch itself off any more.)
SPEAKER_KEEP_AWAKE=yes

# A quick shout-out to people who walk past without stopping (the camera
# sees movement, not a face): yes or no, and at most one every this many
# minutes (a bit more, at random, so it doesn't feel like clockwork).
PASSERBY=yes
PASSERBY_MINUTES=20

# How loud music is, from 0 to 1 (chiptunes carry: 0.5 sits about level
# with the voice).
MUSIC_VOLUME=0.5
