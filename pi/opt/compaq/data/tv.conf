# How the TV standing in for the Compaq shows its screen (lib/tv_terminal.py).
# After changing it: ./deploy.sh (it restarts the TV's program).
#
# TERMINAL  pi      a Compaq running PI.BAT: PILINK is its whole terminal,
#                   so text and pictures arrive as on the real one with PI
#                   (and PAL's eye is drawn in real dots)
#           kermit  a Compaq running Kermit, with PILINK only for pictures
TERMINAL=pi
#
# SIZE  real  the Compaq's own size, a 10-inch panel, so what's on the TV is
#             as big as it will be on the Compaq. Where the TV's pixels are
#             coarser than the Compaq's dots they're blended, much as dithered
#             pictures blend to the eye from a step away.
#       dot   one TV pixel for each of the Compaq's dots: sharp, and on most
#             TVs a little bigger than the real thing.
#       fill  as big as the TV allows (whole TV pixels per dot, sharp).
# F12 on the TV's keyboard switches between fill and real at any time (the
# setting here comes back when the TV's program restarts).
SIZE=real

# The width of the TV's lit picture in millimetres, for SIZE=real: TVs
# don't say (this one claims to be 160 mm wide). The lobby's is a Samsung
# UN32EH4003F (its label): 31.5 inches across, so 697 by 392 mm. Another
# TV: measure its picture, edge to edge, and put that here.
TV_WIDTH_MM=697

# The Compaq's lit area in millimetres: 10 inches across (Compaq's
# specification), 215 by 135 if its 640x400 dots are square (an estimate).
COMPAQ_MM=215x135
