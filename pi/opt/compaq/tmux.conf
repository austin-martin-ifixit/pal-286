# The shared Compaq session. The Compaq's serial cable and every web browser
# are clients of this one 80x24 screen, so whatever anyone types shows up
# everywhere. tmux itself stays invisible: no status bar, and every key goes
# to the program on screen except one.
set -g prefix None
unbind-key -a
# F10 or Ctrl-\, in any program on any screen: back to the main menu. It
# closes the program (NetHack saves itself; other games keep only what was
# saved). The Compaq's Kermit sends Ctrl-\ for its F10 (MSKERMIT.INI).
bind-key -n F10 respawn-pane -k -t compaq "/opt/compaq/session menu"
bind-key -n 'C-\' respawn-pane -k -t compaq "/opt/compaq/session menu"
set -g status off
# Programs draw through tmux and can't send the Compaq anything raw. That
# matters: the Compaq's Kermit runs commands the Pi sends it (the serial
# bridge asks it to start PILINK that way), and nothing on this screen (a
# web page, a BBS, a file someone cats) may be able to.
set -g allow-passthrough off
set -g mouse off
# window-size manual (keep it 80x24 whoever attaches) is set by
# compaq-desk.service after the session starts: in this file it crashes
# tmux 3.5a at startup.
set -g default-size 80x24
set -g default-terminal "screen"
# Long enough for an arrow key's escape sequence to arrive whole at 9600 baud.
set -g escape-time 50
set -g history-limit 200
set -g set-titles off
set -g bell-action none
