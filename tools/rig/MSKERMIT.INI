; MSKERMIT.INI - connects the Compaq to the Raspberry Pi over COM1.
; Kermit reads this file when it starts, then goes straight to the Pi.
set port com1
set speed 9600
set parity none
set flow-control none
; VT102 adds insert/delete line, which cuts screen redraws at 9600 baud.
set terminal type vt102
set terminal bytesize 8
; Text wraps at the end of a line, as the Pi's screen expects.
set terminal wrap on
set terminal autodownload on
; The Pi may send Kermit commands (it asks for RUN PILINK, the fast picture
; program). Only the Pi's serial bridge can: programs on the Pi's shared
; screen draw through tmux, which passes no such command on.
set terminal apc unchecked
set file collision rename
; Backspace sends DEL, which Linux expects (Kermit's default, made explicit).
set key \270 \127
; F10 sends Ctrl-\, the Pi's "back to the main menu" key, from any program.
set key \324 \28
; No status line: a strip that never changes would burn into the plasma.
set mode-line off
echo
echo Connecting to the Raspberry Pi (COM1, 9600 baud).
echo If the screen stays blank, press any key.
echo F10 = the Pi's main menu, from any program.
echo Ctrl-] then C = Kermit prompt.  CONNECT = back to the Pi.  EXIT = quit.
echo
connect
